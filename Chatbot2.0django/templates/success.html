<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; text-align: center; padding: 100px; background: #f4f7fa; }
        .card { background: white; padding: 50px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #10b981; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #000; color: white; text-decoration: none; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Payment Successful!</h1>
        <p>Thank you, <strong>{{ order.name }}</strong>!</p>
        <p>Your <strong>{{ order.plan }}</strong> is now active.</p>
        <p>We have sent the details to your email and our team will contact you shortly.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
